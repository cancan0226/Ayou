<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 GitHub 图床</title>
<style>
  :root { --primary: #6366f1; --bg: #f3f4f6; --card: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: #333; }
  
  /* 顶部紫色渐变标题 */
  header { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  header h1 { font-size: 20px; margin-bottom: 8px; }
  
  .container { max-width: 900px; margin: 20px auto; padding: 0 16px; }
  
  /* 卡片风格 */
  .panel { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
  
  /* 表单元素 */
  input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; outline: none; }
  input:focus { border-color: var(--primary); }
  button { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
  button:hover { background: #4f46e5; }
  button:disabled { background: #a5b4fc; cursor: not-allowed; }
  button.outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  button.danger { background: #ef4444; }
  button.danger:hover { background: #dc2626; }
  button.small { padding: 6px 10px; font-size: 12px; }

  /* 布局 */
  .flex { display: flex; gap: 10px; align-items: center; }
  .flex-1 { flex: 1; }
  .hidden { display: none !important; }
  
  /* 拖拽上传区 */
  #dropzone { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 30px; text-align: center; color: #64748b; cursor: pointer; transition: 0.2s; }
  #dropzone:hover, #dropzone.dragover { border-color: var(--primary); background: #f8fafc; color: var(--primary); }
  
  /* 图库网格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
  .file-card { border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
  .preview { height: 120px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .preview img { width: 100%; height: 100%; object-fit: cover; }
  .preview audio { width: 90%; }
  .file-info { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .filename { font-size: 13px; font-weight: 600; word-break: break-all; color: #1e293b; }
  .url-input { width: 100%; padding: 6px; font-size: 12px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; color: #64748b; }
  .actions { display: flex; gap: 6px; margin-top: auto; }
  .actions button { flex: 1; }

  /* Toast 提示 */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 1000; }
  #toast.show { opacity: 1; }
  
  /* 进度条 */
  #progress-container { margin-top: 10px; background: #e2e8f0; border-radius: 4px; overflow: hidden; height: 6px; display: none; }
  #progress-bar { height: 100%; background: var(--primary); width: 0%; transition: 0.2s; }
</style>
</head>
<body>

<header>
  <h1>🚀 我的 GitHub 专属图床</h1>
  <div style="font-size: 12px; opacity: 0.8;">基于 GitHub API 纯前端实现</div>
</header>

<div class="container">
  <!-- Token 设置区 -->
  <div class="panel" id="tokenPanel">
    <div class="flex">
      <input type="password" id="tokenInput" placeholder="输入 GitHub Token (ghp_ 开头)" class="flex-1">
      <button onclick="saveToken()">保存</button>
    </div>
    <div style="font-size: 12px; color: #64748b; margin-top: 8px;">
      Token 仅保存在你的浏览器本地，不会上传到任何服务器。
    </div>
  </div>

  <!-- 上传区 -->
  <div class="panel hidden" id="uploadPanel">
    <div class="flex" style="justify-content: space-between; margin-bottom: 12px;">
      <h3 style="font-size: 16px;">上传文件</h3>
      <button class="outline small" onclick="loadFiles()">🔄 刷新图库</button>
    </div>
    
    <div id="dropzone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 24px; margin-bottom: 8px;">📁</div>
      <div>点击选择，或将文件拖拽到此处</div>
      <div style="font-size: 12px; margin-top: 4px; color: #94a3b8;">支持图片及音频，可多选</div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*,audio/*" class="hidden" onchange="handleFiles(this.files)">
    
    <div id="progress-container"><div id="progress-bar"></div></div>
  </div>

  <!-- 图库展示区 -->
  <div class="panel hidden" id="galleryPanel">
    <h3 style="font-size: 16px; margin-bottom: 16px;">我的图库</h3>
    <div class="grid" id="galleryGrid"></div>
    <div id="emptyTip" class="hidden" style="text-align: center; color: #94a3b8; padding: 20px;">图库为空，快去上传吧~</div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ==========================================
   已经为你配置好了个人信息
   ========================================== */
const GITHUB_USER = 'cancan0226';  // 你的 GitHub 用户名
const GITHUB_REPO = 'Ayou';        // 你的仓库名
const GITHUB_BRANCH = 'main';      // 默认分支
const GITHUB_PATH = '';            // 留空即可

/* ========================================== */

const API_BASE = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
let token = localStorage.getItem('gh_token') || '';

// 初始化
window.onload = () => {
  if (token) {
    document.getElementById('tokenInput').value = token;
    showMainApp();
  }
};

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.background = isError ? 'rgba(220,38,38,0.9)' : 'rgba(0,0,0,0.8)';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function saveToken() {
  const input = document.getElementById('tokenInput').value.trim();
  if (!input) return showToast('请输入 Token', true);
  token = input;
  localStorage.setItem('gh_token', token);
  showMainApp();
  showToast('Token 保存成功');
}

function showMainApp() {
  document.getElementById('tokenPanel').classList.add('hidden');
  document.getElementById('uploadPanel').classList.remove('hidden');
  document.getElementById('galleryPanel').classList.remove('hidden');
  loadFiles();
}

const getHeaders = () => ({
  'Authorization': `token ${token}`,
  'Accept': 'application/vnd.github.v3+json',
  'Content-Type': 'application/json'
});

const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

async function handleFiles(files) {
  const progressContainer = document.getElementById('progress-container');
  const progressBar = document.getElementById('progress-bar');
  progressContainer.style.display = 'block';
  progressBar.style.width = '0%';

  let successCount = 0;
  let failCount = 0;
  
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const validImage = /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i.test(file.name);
    const validAudio = /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(file.name);
    
    if (!validImage && !validAudio) {
      showToast(`跳过不支持的文件: ${file.name}`, true);
      continue;
    }

    try {
      await uploadFile(file);
      successCount++;
    } catch (err) {
      failCount++;
      showToast(`上传失败: ${file.name}`, true);
      console.error(err);
    }
    
    progressBar.style.width = `${((i + 1) / files.length) * 100}%`;
  }

  setTimeout(() => progressContainer.style.display = 'none', 800);
  if (successCount) {
    showToast(`成功上传 ${successCount} 个文件${failCount ? `, 失败 ${failCount} 个` : ''}`);
    loadFiles();
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadFile(file) {
  const timestamp = Date.now();
  const safeName = file.name.replace(/[^\w.\-]/g, '_');
  const filename = GITHUB_PATH ? `${GITHUB_PATH}/${timestamp}_${safeName}` : `${timestamp}_${safeName}`;
  
  const base64Content = await fileToBase64(file);
  
  const res = await fetch(`${API_BASE}${filename}`, {
    method: 'PUT',
    headers: getHeaders(),
    body: JSON.stringify({
      message: `Upload ${filename}`,
      content: base64Content,
      branch: GITHUB_BRANCH
    })
  });
  
  if (!res.ok) {
    const data = await res.json();
    throw new Error(data.message || 'Upload failed');
  }
  return await res.json();
}

async function loadFiles() {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '<div style="color:#64748b;">加载中...</div>';
  
  try {
    const res = await fetch(`${API_BASE}?ref=${GITHUB_BRANCH}`, { headers: getHeaders() });
    if (!res.ok) throw new Error('无法读取仓库内容，请检查 Token 或仓库名');
    
    const files = await res.json();
    const validFiles = files.filter(f => f.type === 'file' && !f.name.startsWith('.'));
    
    renderGallery(validFiles);
  } catch (err) {
    grid.innerHTML = '';
    showToast(err.message, true);
  }
}

function renderGallery(files) {
  const grid = document.getElementById('galleryGrid');
  const emptyTip = document.getElementById('emptyTip');
  
  if (!files || files.length === 0) {
    grid.innerHTML = '';
    emptyTip.classList.remove('hidden');
    return;
  }
  emptyTip.classList.add('hidden');
  
  grid.innerHTML = '';
  
  files.forEach(file => {
    const url = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${file.path}`;
    
    const isImage = /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i.test(file.name);
    const isAudio = /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(file.name);
    
    let previewHtml = '';
    if (isImage) {
      previewHtml = `<img src="${url}" alt="${file.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22>加载失败</text></svg>'">`;
    } else if (isAudio) {
      previewHtml = `<audio controls src="${url}"></audio>`;
    } else {
      previewHtml = `<div style="color:#94a3b8; font-size:12px;">未知文件类型</div>`;
    }

    const card = document.createElement('div');
    card.className = 'file-card';
    card.innerHTML = `
      <div class="preview">${previewHtml}</div>
      <div class="file-info">
        <div class="filename" title="${file.name}">${file.name}</div>
        <input type="text" class="url-input" value="${url}" readonly onclick="this.select()">
        <div class="actions">
          <button class="small outline" onclick="copyText('${url}')">复制</button>
          <button class="small outline" onclick="window.open('${url}', '_blank')">打开</button>
          <button class="small danger" onclick="deleteFile('${file.path}', '${file.sha}')">删除</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制外链');
  }).catch(() => {
    showToast('复制失败，请手动选择复制', true);
  });
}

async function deleteFile(path, sha) {
  if (!confirm(`确定要删除文件 ${path} 吗？`)) return;
  
  try {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'DELETE',
      headers: getHeaders(),
      body: JSON.stringify({
        message: `Delete ${path}`,
        sha: sha,
        branch: GITHUB_BRANCH
      })
    });
    
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.message || '删除失败');
    }
    
    showToast('删除成功');
    loadFiles();
  } catch (err) {
    showToast(err.message, true);
  }
}
</script>
</body>
  </html>
